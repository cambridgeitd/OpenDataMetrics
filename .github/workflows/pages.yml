name: Refresh metrics and publish Pages

on:
  workflow_dispatch:
  schedule:
    - cron: "23 8 * * *"
  push:
    branches: ["main"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh Socrata metrics
        env:
          SOCRATA_USERNAME: ${{ secrets.SOCRATA_USERNAME }}
          SOCRATA_PASSWORD: ${{ secrets.SOCRATA_PASSWORD }}
          SOCRATA_DOMAIN: data.cambridgema.gov
        run: python scripts/fetch_metrics.py
      - name: Commit refreshed generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed docs/data
          if git diff --cached --quiet; then
            echo "No generated data changes to commit."
          else
            git commit -m "Refresh generated metrics [skip ci]"
            git push origin HEAD:main
          fi
      - name: Upload dashboard artifact
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-site
          path: docs
      - uses: actions/configure-pages@v5
        if: ${{ github.event.repository.private == false }}
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        if: ${{ github.event.repository.private == false }}
        with:
          path: docs
      - uses: actions/deploy-pages@v4
        if: ${{ github.event.repository.private == false }}
