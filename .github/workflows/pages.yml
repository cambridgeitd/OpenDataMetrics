name: Refresh metrics and publish Pages

on:
  workflow_dispatch:
  schedule:
    - cron: "23 8 1 * *"
  push:
    branches: ["main"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh Socrata metrics
        env:
          SOCRATA_USERNAME: ${{ secrets.SOCRATA_USERNAME }}
          SOCRATA_PASSWORD: ${{ secrets.SOCRATA_PASSWORD }}
          SOCRATA_DOMAIN: data.cambridgema.gov
        run: python scripts/fetch_metrics.py
      - name: Upload dashboard artifact
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-site
          path: docs
      - uses: actions/configure-pages@v5
        if: ${{ github.event.repository.private == false }}
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        if: ${{ github.event.repository.private == false }}
        with:
          path: docs
      - uses: actions/deploy-pages@v4
        if: ${{ github.event.repository.private == false }}
