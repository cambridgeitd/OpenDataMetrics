<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cambridge Open Data Metrics</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="app-header">
      <div>
        <p class="eyebrow">Data Analytics & Open Data Program</p>
        <h1>Cambridge Open Data Metrics</h1>
      </div>
      <div class="header-meta">
        <span id="generatedAt">Loading...</span>
        <a href="https://data.cambridgema.gov" target="_blank" rel="noreferrer">Open Data Portal</a>
      </div>
    </header>

    <main>
      <nav class="tabs" aria-label="Dashboard sections">
        <button class="tab is-active" data-tab="overview">Snapshot</button>
        <button class="tab" data-tab="usage">Timeline</button>
        <button class="tab" data-tab="portfolio">Coverage</button>
        <button class="tab" data-tab="gaps">Gaps</button>
      </nav>

      <section class="tab-panel is-active" id="overview">
        <section class="kpi-grid" id="kpiGrid"></section>
        <section class="panel">
          <div class="panel-head">
            <h2>Top Dataset Activity</h2>
            <div class="segmented-control" id="snapshotWindowControl" aria-label="Dataset activity period">
              <button class="segment is-active" type="button" data-days="365">12 months</button>
              <button class="segment" type="button" data-days="90">90 days</button>
              <button class="segment" type="button" data-days="30">30 days</button>
            </div>
          </div>
          <div class="filter-note" id="datasetActivityNote"></div>
          <div class="table-wrap">
            <table id="snapshotDatasetTable"></table>
          </div>
        </section>
      </section>

      <section class="tab-panel" id="usage">
        <section class="panel">
          <div class="panel-head">
            <h2>Explore Metrics</h2>
            <div class="controls">
              <select id="metricSelect"></select>
              <select id="periodSelect">
                <option value="month">Monthly</option>
                <option value="year">Yearly</option>
              </select>
              <select id="rangeSelect">
                <option value="36">36 months</option>
                <option value="12">12 months</option>
                <option value="60">60 months</option>
                <option value="all">All</option>
              </select>
            </div>
          </div>
          <div class="usage-filters" id="usageFilters">
            <input id="assetFilter" type="search" list="assetOptions" placeholder="Filter asset name..." aria-label="Asset name filter" autocomplete="off" />
            <input id="categoryFilter" type="search" list="categoryOptions" placeholder="Filter category..." aria-label="Category filter" autocomplete="off" />
            <input id="keywordFilter" type="search" list="keywordOptions" placeholder="Filter keyword..." aria-label="Keyword filter" autocomplete="off" />
            <button class="clear-button" id="clearUsageFilters" type="button">Clear filters</button>
          </div>
          <datalist id="assetOptions"></datalist>
          <datalist id="categoryOptions"></datalist>
          <datalist id="keywordOptions"></datalist>
          <div class="filter-note" id="usageFilterNote"></div>
          <div class="chart tall" id="metricChart"></div>
          <div class="data-strip" id="metricStrip"></div>
        </section>
      </section>

      <section class="tab-panel" id="portfolio">
        <section class="layout two-col">
          <div class="panel">
            <div class="panel-head">
              <h2>Datasets By Category</h2>
            </div>
            <div class="bar-chart" id="categoryChart"></div>
          </div>
          <div class="panel">
            <div class="panel-head">
              <h2>Datasets By Keyword</h2>
            </div>
            <div class="bar-chart" id="keywordChart"></div>
          </div>
        </section>
      </section>

      <section class="tab-panel" id="gaps">
        <section class="layout two-col">
          <div class="panel">
            <div class="panel-head">
              <h2>Metric Gaps</h2>
            </div>
            <div class="gap-list" id="gapList"></div>
          </div>
          <div class="panel">
            <div class="panel-head">
              <h2>Stale Scheduled Datasets</h2>
            </div>
            <div class="table-wrap">
              <table id="staleDatasets"></table>
            </div>
          </div>
        </section>
      </section>
    </main>

    <script src="dashboard.js"></script>
  </body>
</html>
